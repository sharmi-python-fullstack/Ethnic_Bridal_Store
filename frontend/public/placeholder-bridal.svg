  <rect x="0" y="494" width="400" height="6" fill="#D4AF37"/>
  <!-- Paisley decorative border -->
  <circle cx="30" cy="30" r="18" fill="none" stroke="#9B1313" stroke-width="1.5" opacity="0.3"/>
  <circle cx="370" cy="30" r="18" fill="none" stroke="#9B1313" stroke-width="1.5" opacity="0.3"/>
  <circle cx="30" cy="470" r="18" fill="none" stroke="#9B1313" stroke-width="1.5" opacity="0.3"/>
  <circle cx="370" cy="470" r="18" fill="none" stroke="#9B1313" stroke-width="1.5" opacity="0.3"/>
  <!-- Crown icon -->
