services:
  # ── Backend (Django) ────────────────────────────────────────────────────────
  - type: web
    name: shaaz-ethnicwear-backend
    runtime: python
    region: singapore
    rootDir: backend
    # Render runs this command from backend/ because rootDir is backend.
    # The shared build script is one level above that directory.
    buildCommand: "bash ../build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: shaaz-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # SMTP email delivery (Gmail example). Add the two secret values in
      # the Render dashboard; do not place a normal Gmail password in Git.
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_TIMEOUT
        value: "20"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://shaaz-ethnicwear.onrender.com,http://localhost:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://shaaz-ethnicwear.onrender.com,https://shaaz-ethnicwear-backend.onrender.com"

  # ── Frontend (React / Vite static site) ────────────────────────────────────
  - type: web
    name: shaaz-ethnicwear
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE
        value: "https://shaaz-ethnicwear-backend.onrender.com"
      - key: VITE_API_URL
        value: "https://shaaz-ethnicwear-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: shaaz-db
    region: singapore
    databaseName: shaaz_ethnicwear
    user: shaaz_admin
